name: 🚀 部署到 GitHub Pages

on:
  push:
    branches: [ main ]  # 每次推送到 main 分支時自動觸發部署
  workflow_dispatch:    # 也可以手動觸發

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 📥 下載程式碼
        uses: actions/checkout@v4

      - name: 🟢 設定 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 安裝套件
        working-directory: ./frontend
        run: npm ci

      - name: 🔨 編譯專案
        working-directory: ./frontend
        run: npm run build

      - name: 📋 設定 GitHub Pages
        uses: actions/configure-pages@v4
        with:
          enablement: true   # 自動開啟 GitHub Pages（如果還沒開啟）

      - name: 📤 上傳編譯結果
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend/dist'

      - name: 🌐 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
